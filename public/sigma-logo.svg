<svg viewBox="0 0 500 500" width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="maroonSealGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#6e1322" />
      <stop offset="70%" stopColor="#520d18" />
      <stop offset="100%" stopColor="#2d040a" />
    </radialGradient>
    <linearGradient id="goldRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#eab308" />
      <stop offset="100%" stopColor="#ca8a04" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="1" />
    </linearGradient>
    <path id="upperTextArc" d="M 55,250 A 195,195 0 1,1 445,250" fill="none" />
    <path id="lowerTextArc" d="M 445,250 A 195,195 0 0,1 55,250" fill="none" />
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#000000" floodOpacity="0.6" />
    </filter>
  </defs>

  <circle cx="250" cy="250" r="240" fill="url(#maroonSealGrad)" stroke="#facc15" stroke-width="5" filter="url(#sealShadow)" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7" />
