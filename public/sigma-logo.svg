    <circle cx="295" cy="300" r="4" />
    <circle cx="325" cy="320" r="4" />
    <circle cx="350" cy="295" r="4" />
  </g>

  <!-- Open Book -->
  <g filter="url(#sealShadow)">
    <ellipse cx="250" cy="390" rx="140" ry="24" fill="#2d040a" stroke="#facc15" stroke-width="1.5" />
    <path d="M 250,380 C 210,365 170,368 135,372 C 142,352 180,346 250,362 Z" fill="#f8fafc" stroke="#2d040a" stroke-width="1.2" />
    <path d="M 250,380 C 210,360 170,362 130,366 C 137,346 178,340 250,356 Z" fill="#e2e8f0" stroke="#2d040a" stroke-width="1.2" />
    <path d="M 250,380 C 210,355 170,356 125,360 C 132,340 175,334 250,350 Z" fill="#ffffff" stroke="#2d040a" stroke-width="1.5" />

    <path d="M 250,380 C 290,365 330,368 365,372 C 358,352 320,346 250,362 Z" fill="#f8fafc" stroke="#2d040a" stroke-width="1.2" />
    <path d="M 250,380 C 290,360 330,362 370,366 C 363,346 322,340 250,356 Z" fill="#e2e8f0" stroke="#2d040a" stroke-width="1.2" />
    <path d="M 250,380 C 290,355 330,356 375,360 C 368,340 325,334 250,350 Z" fill="#ffffff" stroke="#2d040a" stroke-width="1.5" />

    <line x1="250" y1="350" x2="250" y2="384" stroke="#520d18" stroke-width="3" />
    <g stroke="#94a3b8" stroke-width="1.2" opacity="0.6">
